name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: piano-template-1.21.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Java
        run: java -version

      - name: Build Mod
        run: ./gradlew build

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: piano-mod
          path: piano-template-1.21.4/build/libs/*.jar
